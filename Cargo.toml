[workspace]
members = ["cleanrs-core", "cleanrs"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/bence/cleanrs"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0"
bitflags = { version = "2.9", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
clap_mangen = "0.2"
# 7.2 uses let-chains, which are unavailable on the workspace's Rust 1.85 MSRV.
comfy-table = "=8.0.0"
console = "0.15"
crossbeam-channel = "0.5"
# 0.4.20 raised its MSRV to Rust 1.88. Keep the workspace's declared Rust
# 1.85 support until cleanrs deliberately raises its own MSRV.
globset = "=0.4.19"
indicatif = "0.17"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "allow"

[workspace.lints.clippy]
all = "warn"
