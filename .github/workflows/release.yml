# Dispatch only: a single run owns versioning, tags, builds, and publication.
# GITHUB_TOKEN tag pushes do not trigger workflows; all release work lives here.
# Publish BEFORE updating the tap so the formula's download URLs already resolve.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (auto uses conventional commits)
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      dry_run:
        description: Build and upload artifacts without publishing or pushing
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Require main for publication
        if: ${{ !inputs.dry_run && github.ref != 'refs/heads/main' }}
        run: echo '::error::Published releases must run from main'; exit 1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install stable Rust
        run: rustup update stable && rustup default stable
      - name: Configure release author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Require a clean checkout
        run: test -z "$(git status --porcelain)"
      - name: Compute and apply workspace version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: scripts/bump-version.sh "$BUMP"
      # Dry runs carry the bumped manifests to every builder; HEAD itself stays put.
      - uses: actions/upload-artifact@v4
        if: inputs.dry_run
        with:
          name: release-manifests
          path: |
            Cargo.toml
            Cargo.lock
          if-no-files-found: error
      - name: Commit, tag, and push
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          set -euo pipefail
          # Check before any writes, and let a concurrent remote update fail the push.
          existing=$(git ls-remote --tags origin "refs/tags/$TAG" "refs/tags/$TAG^{}")
          test -z "$existing" || { echo "::error::Remote tag $TAG already exists"; exit 1; }
          git add Cargo.toml Cargo.lock
          if ! git diff --cached --quiet; then git commit -m "chore(release): $TAG"; fi
          git tag -a "$TAG" -m "cleanrs $TAG"
          git push origin HEAD:refs/heads/main
          git push origin "refs/tags/$TAG"
      - name: Record build commit
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: version
    runs-on: macos-15
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
      APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/download-artifact@v4
        if: inputs.dry_run
        with:
          name: release-manifests
          path: .
      - name: Install stable Rust and both targets
        run: |
          rustup update stable
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build both architectures
        run: |
          cargo build --release --locked -p cleanrs --target aarch64-apple-darwin
          cargo build --release --locked -p cleanrs --target x86_64-apple-darwin
      - name: Unsigned build notice
        if: env.APPLE_CERTIFICATE_P12_BASE64 == ''
        run: echo '::warning::Apple signing secrets are absent; publishing unsigned macOS binaries'
      - name: Sign and notarize before packaging
        if: env.APPLE_CERTIFICATE_P12_BASE64 != ''
        shell: bash
        run: |
          set -euo pipefail
          : "${APPLE_CERTIFICATE_PASSWORD:?Missing certificate password}"
          : "${APPLE_SIGNING_IDENTITY:?Missing signing identity}"
          : "${APPLE_API_KEY_P8_BASE64:?Missing API key}"
          : "${APPLE_API_KEY_ID:?Missing API key ID}"
          : "${APPLE_API_ISSUER_ID:?Missing issuer ID}"
          keychain="$RUNNER_TEMP/cleanrs-signing.keychain-db"
          password=$(openssl rand -hex 32)
          echo "::add-mask::$password"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cleanrs-cert.p12"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/cleanrs-key.p8"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          # Put the temporary keychain on the search list so codesign resolves the identity.
          existing_keychains=()
          while IFS= read -r line; do
            line=${line//\"/}; existing_keychains+=("${line#"${line%%[![:space:]]*}"}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing_keychains[@]}"
          security import "$RUNNER_TEMP/cleanrs-cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -k "$keychain" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            binary="target/$target/release/cleanrs"
            codesign --force --timestamp --options runtime --keychain "$keychain" --sign "$APPLE_SIGNING_IDENTITY" "$binary"
            codesign --verify --strict "$binary"
            ditto -c -k --keepParent "$binary" "$RUNNER_TEMP/$target.zip"
            xcrun notarytool submit "$RUNNER_TEMP/$target.zip" \
              --key "$RUNNER_TEMP/cleanrs-key.p8" --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER_ID" --wait --output-format json > "$RUNNER_TEMP/$target-notary.json"
            /usr/bin/plutil -extract status raw -o - "$RUNNER_TEMP/$target-notary.json" | grep -qx Accepted
          done
          # Bare Mach-O binaries cannot be stapled; Gatekeeper checks tickets online.
      - name: Smoke test native binary in a disposable tree
        shell: bash
        run: |
          set -euo pipefail
          binary="$PWD/target/aarch64-apple-darwin/release/cleanrs"
          test "$("$binary" --version)" = "cleanrs $VERSION"
          fixture=$(mktemp -d "$RUNNER_TEMP/cleanrs-smoke.XXXXXX")
          trap 'rm -rf "$fixture"' EXIT
          mkdir -p "$fixture/project/node_modules" "$fixture/home"
          printf '{}\n' > "$fixture/project/package.json"
          printf 'fixture\n' > "$fixture/project/node_modules/example"
          HOME="$fixture/home" "$binary" scan "$fixture/project" --json
          HOME="$fixture/home" "$binary" clean "$fixture/project" --workspace-only
      - name: Package both architectures
        run: |
          scripts/package-release.sh aarch64-apple-darwin target/aarch64-apple-darwin/release/cleanrs "$VERSION" dist
          scripts/package-release.sh x86_64-apple-darwin target/x86_64-apple-darwin/release/cleanrs "$VERSION" dist target/aarch64-apple-darwin/release/cleanrs
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/*
          if-no-files-found: error
      - name: Remove signing credentials
        if: always()
        shell: bash
        run: |
          cleanup_status=0
          if [ -f "$RUNNER_TEMP/cleanrs-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/cleanrs-signing.keychain-db" || cleanup_status=$?
          fi
          # Remove private files even if keychain deletion itself fails.
          rm -f "$RUNNER_TEMP/cleanrs-cert.p12" "$RUNNER_TEMP/cleanrs-key.p8"
          exit "$cleanup_status"

  build-linux:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/download-artifact@v4
        if: inputs.dry_run
        with:
          name: release-manifests
          path: .
      - name: Install stable Rust, musl target and tools
        run: |
          rustup update stable
          rustup default stable
          rustup target add "$TARGET"
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p cleanrs --target "$TARGET"
      - name: Smoke test in a disposable tree
        run: |
          set -euo pipefail
          binary="$PWD/target/$TARGET/release/cleanrs"
          test "$("$binary" --version)" = "cleanrs $VERSION"
          fixture=$(mktemp -d "$RUNNER_TEMP/cleanrs-smoke.XXXXXX")
          trap 'rm -rf "$fixture"' EXIT
          mkdir -p "$fixture/project/node_modules" "$fixture/home"
          printf '{}\n' > "$fixture/project/package.json"
          printf 'fixture\n' > "$fixture/project/node_modules/example"
          HOME="$fixture/home" "$binary" scan "$fixture/project" --json
          HOME="$fixture/home" "$binary" clean "$fixture/project" --workspace-only
      - run: scripts/package-release.sh "$TARGET" "target/$TARGET/release/cleanrs" "$VERSION" dist
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  nix:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/download-artifact@v4
        if: inputs.dry_run
        with:
          name: release-manifests
          path: .
      - uses: cachix/install-nix-action@v31
      - run: nix build .#default -L
      - run: test "$(./result/bin/cleanrs --version)" = "cleanrs $VERSION"

  publish:
    needs: [version, build-macos, build-linux, nix]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify archives and publish
        working-directory: dist
        run: |
          set -euo pipefail
          test "$(find . -name '*.tar.gz' | wc -l)" -eq 4
          test "$(find . -name '*.sha256' | wc -l)" -eq 4
          cat ./*.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
          gh release create "$TAG" --verify-tag --generate-notes --title "cleanrs $VERSION" \
            ./*.tar.gz ./*.sha256 SHA256SUMS

  homebrew:
    needs: [version, publish]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      # Publication is already complete; this job can be re-run alone after fixing credentials.
      - name: Require tap credentials
        run: |
          test -n "$HOMEBREW_TAP_TOKEN" || {
            echo '::error::Set HOMEBREW_TAP_TOKEN to a fine-grained PAT with Contents read/write on bencetotht/homebrew-tap, then re-run this job.'
            exit 1
          }
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.sha }}
          path: source
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - uses: actions/checkout@v4
        with:
          repository: bencetotht/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Render and update formula
        shell: bash
        run: |
          set -euo pipefail
          # Checksums come from the exact signed/packaged assets already published.
          sha() { awk '{print $1}' "dist/cleanrs-$VERSION-$1.tar.gz.sha256"; }
          arm_mac=$(sha aarch64-apple-darwin)
          intel_mac=$(sha x86_64-apple-darwin)
          arm_linux=$(sha aarch64-unknown-linux-musl)
          intel_linux=$(sha x86_64-unknown-linux-musl)
          for value in "$arm_mac" "$intel_mac" "$arm_linux" "$intel_linux"; do
            [[ "$value" =~ ^[0-9a-f]{64}$ ]]
          done
          mkdir -p tap/Formula
          sed -e "s/@VERSION@/$VERSION/g" \
            -e "s/@SHA_AARCH64_APPLE_DARWIN@/$arm_mac/g" \
            -e "s/@SHA_X86_64_APPLE_DARWIN@/$intel_mac/g" \
            -e "s/@SHA_AARCH64_UNKNOWN_LINUX_MUSL@/$arm_linux/g" \
            -e "s/@SHA_X86_64_UNKNOWN_LINUX_MUSL@/$intel_linux/g" \
            source/packaging/homebrew/cleanrs.rb.tmpl > tap/Formula/cleanrs.rb
          if grep -Eq '@[A-Z_]+@' tap/Formula/cleanrs.rb; then
            echo '::error::Unresolved formula placeholder'; exit 1
          fi
          ruby -c tap/Formula/cleanrs.rb
          cd tap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/cleanrs.rb
          if ! git diff --cached --quiet; then
            git commit -m "cleanrs $VERSION"
            git push
          fi
