name: Release binaries

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked -p cleanrs
      - run: tar -C target/release -czf cleanrs-aarch64-apple-darwin.tar.gz cleanrs
      - uses: softprops/action-gh-release@v3
        with:
          files: cleanrs-aarch64-apple-darwin.tar.gz

